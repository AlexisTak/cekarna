services:
  tests:
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgres://cekarna:${POSTGRES_PASSWORD:?Run init-dev}@postgres:5432/cekarna_auth?sslmode=disable
      TEST_REDIS_URL: redis://:${REDIS_PASSWORD:?Run init-dev}@redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
