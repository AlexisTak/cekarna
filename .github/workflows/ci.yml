name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cekarna_website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            cekarna_website/package-lock.json
            cekarna_website/web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run check:all
